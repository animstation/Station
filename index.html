<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Animator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bg"></div>

  <section id="home" class="view active">
    <header class="top"><h1>Animator</h1></header>
    <main id="grid"></main>
  </section>

  <section id="editor" class="view">
    <header class="top">
      <button id="back" class="icon" aria-label="Back">‹</button>
      <input id="name" maxlength="40" aria-label="Project name">
      <button id="undo">Undo</button>
      <button id="play" class="primary">Play</button>
    </header>

    <div id="work">
      <aside id="menu">
        <nav id="tabs">
          <button data-p="tools" class="on">Tools</button>
          <button data-p="layers">Layers</button>
          <button data-p="fx">Shaders</button>
          <button data-p="project">Project</button>
        </nav>

        <div id="panels">
          <div class="panel on" id="p-tools">
            <div class="grid3">
              <button id="tBrush" class="on">Brush</button>
              <button id="tErase">Erase</button>
              <button id="tSwap">Color swap</button>
              <button id="tMove">Move</button>
              <button id="tBend">Bend</button>
              <button id="tHand">Pan</button>
            </div>
            <div class="row">
              <input type="color" id="color" value="#000000" aria-label="Color">
              <input type="range" id="size" min="2" max="30" value="6" aria-label="Brush size">
            </div>
            <div id="swatches"></div>
            <div class="row">
              <label class="btn">Add image<input type="file" id="imgFile" accept="image/*"></label>
              <button id="imgDel">Delete image</button>
            </div>
            <div class="row">
              <label class="btn">Reference<input type="file" id="refFile" accept="image/*"></label>
              <input type="range" id="refAlpha" min="0.05" max="1" step="0.05" value="0.4" aria-label="Reference opacity">
            </div>
          </div>

          <div class="panel" id="p-layers">
            <div id="layerList"></div>
            <div class="grid2">
              <button id="addL">+ Layer</button>
              <button id="addF">+ Fill layer</button>
              <button id="lDup">Duplicate</button>
              <button id="lDel">Delete</button>
              <button id="lUp">Move up</button>
              <button id="lDn">Move down</button>
              <button id="lCopy">Copy art</button>
              <button id="lPaste">Paste art</button>
            </div>
          </div>

          <div class="panel" id="p-fx">
            <div class="grid3" id="fxList"></div>
            <label class="fps">Intensity<input type="range" id="fxK" min="0" max="1" step="0.05" value="0.5"></label>
            <small>Shaders preview the final look. The reference image and onion skin are hidden while one is on.</small>
          </div>

          <div class="panel" id="p-project">
            <div class="row">
              <label class="fps">Season<input type="number" id="season" min="1" max="99" value="1"></label>
              <label class="fps">Episode<input type="number" id="episode" min="1" max="999" value="1"></label>
            </div>
            <select id="status" aria-label="Status"><option>Planned</option><option>In progress</option><option>Done</option></select>
            <div class="grid3" id="ratios"></div>
            <div class="row">
              <label class="fps">Ratio<input type="number" id="rw" min="1" value="9"></label>:
              <input type="number" id="rh" min="1" value="16" aria-label="Height part">
              <button id="setRatio">Set</button>
            </div>
            <button id="export" class="primary">Export video</button>
            <span id="exportOut"></span>
          </div>
        </div>
      </aside>

      <div id="viewport">
        <div id="stage">
          <img id="ref" alt="" hidden>
          <canvas id="onion"></canvas>
          <canvas id="draw"></canvas>
          <canvas id="fx"></canvas>
          <canvas id="ui"></canvas>
        </div>
        <div id="tip"></div>
        <div id="zoom">
          <button id="zOut" aria-label="Zoom out">−</button>
          <span id="zoomPct">100%</span>
          <button id="zIn" aria-label="Zoom in">+</button>
          <button id="zFit">Fit</button>
        </div>
      </div>

      <footer id="timeline">
        <div id="strip"></div>
        <div id="tlbar">
          <button id="prev" class="icon" aria-label="Previous frame">‹</button>
          <span id="label"></span>
          <button id="next" class="icon" aria-label="Next frame">›</button>
          <button id="add">+ Frame</button>
          <button id="dup">Duplicate</button>
          <button id="fCopy">Copy</button>
          <button id="fPaste">Paste</button>
          <button id="fMerge">Merge</button>
          <button id="fromLast">From last</button>
          <button id="del">Delete</button>
          <button id="clear">Clear</button>
          <button id="onionBtn" class="on">Onion</button>
          <label class="fps">FPS<input type="number" id="fps" min="1" max="60" value="12"></label>
        </div>
      </footer>
    </div>
  </section>

  <div id="flip">
    <div class="phone"></div>
    <b>Flip your phone for a better experience</b>
    <small>The studio works best in landscape.</small>
    <button id="flipOk">Continue anyway</button>
  </div>
  <div id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
